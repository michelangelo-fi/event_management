{% extends 'base.html' %}

{% block title %}Crea evento{% endblock %}

{% block content %}
<h2 class="mb-4">Crea un nuovo evento</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger">{{ field.errors }}</div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Crea evento</button>
</form>
{% endblock %}
