{% extends 'base.html' %}

{% block title %}Elimina evento{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Elimina evento</h2>
        <p>Sei sicuro di voler eliminare <strong>{{ event.title }}</strong>? L'operazione è irreversibile.</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'event_detail' event.pk %}" class="btn btn-secondary">Annulla</a>
            <button type="submit" class="btn btn-danger">Elimina</button>
        </form>
    </div>
</div>
{% endblock %}
